name: Build Windows EXE

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: MSVC (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Load the developer environment of whatever Visual Studio the runner
      # ships (2022, 2026, ...). This puts cl.exe, rc.exe and the Windows SDK
      # (fxc.exe) on PATH, so CMake can use Ninja without knowing the VS version.
      - name: Set up MSVC developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -prerelease -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'No Visual Studio with the C++ toolset found' }
          Write-Host "Using Visual Studio at $vsPath"
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /s /c "`"$vcvars`" > nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])"
            }
          }

      - name: Configure (CMake + Ninja, MSVC)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: soft-tempest-windows
          path: build/*.exe
          if-no-files-found: error

  # Cross-check: the same sources also build with MinGW-w64 on Linux
  # (run-time shader compilation path).
  build-mingw:
    name: MinGW-w64 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 cmake ninja-build

      - name: Configure (CMake, MinGW)
        run: cmake -S . -B build-mingw -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build-mingw

      - name: Upload EXE (MinGW)
        uses: actions/upload-artifact@v4
        with:
          name: soft-tempest-windows-mingw
          path: build-mingw/*.exe
          if-no-files-found: error
